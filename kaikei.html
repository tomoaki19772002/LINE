<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>LINE会計（カード請求） | 川越あさひ眼科</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Meiryo', sans-serif;
      background: linear-gradient(135deg, #e8f4fd 0%, #d0e8f8 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 20px 56px;
      gap: 24px;
      color: #263238;
    }

    h1 { font-size: 1.4rem; color: #1565c0; letter-spacing: 0.08em; }
    .sub-lead { color: #4a6b8a; font-size: 0.9rem; text-align: center; max-width: 520px; line-height: 1.6; }

    .panel {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0,60,140,0.12);
      padding: 24px 28px;
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .panel h2 { font-size: 1.1rem; color: #1565c0; letter-spacing: 0.05em; }

    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    input[type=text], input[type=password], input[type=number] {
      font-size: 1.2rem; padding: 10px 12px; border: 1.5px solid #b0bec5;
      border-radius: 10px; width: 100%; max-width: 220px; background: #fff;
    }
    input:focus { outline: none; border-color: #1565c0; }
    label.field { display: flex; flex-direction: column; gap: 4px; font-size: 0.85rem; font-weight: bold; color: #455a64; }

    .btn {
      border: none; border-radius: 24px; padding: 10px 22px;
      font-size: 1rem; font-weight: bold; cursor: pointer; background: #1565c0; color: #fff;
    }
    .btn.green { background: linear-gradient(135deg, #06c755, #05a648); }
    .btn.ghost { background: #fff; color: #607d8b; border: 1.5px solid #b0bec5; }
    .btn.small { padding: 6px 14px; font-size: 0.85rem; }
    .btn:disabled { opacity: 0.5; cursor: default; }

    .msg { min-height: 1.4em; font-size: 0.95rem; font-weight: bold; }
    .msg.ok { color: #06a648; }
    .msg.warn { color: #e65100; }
    .msg.err { color: #c62828; }

    .target { background: #e3f2fd; border-radius: 12px; padding: 12px 16px; line-height: 1.6; }
    .target b { font-size: 1.15rem; }

    .pending { border: 1.5px solid #cfd8dc; border-radius: 14px; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
    .pending .head { font-weight: bold; color: #37474f; }
    .pending .card-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 0.95rem; }
    .hint { font-size: 0.8rem; color: #78909c; line-height: 1.6; }
    .empty { color: #b0bec5; font-size: 0.9rem; }

    .log-row { font-size: 0.9rem; display: flex; gap: 10px; flex-wrap: wrap; padding: 4px 0; border-bottom: 1px solid #eceff1; }
    .log-row .ng { color: #c62828; font-weight: bold; }
    .log-row .good { color: #06a648; font-weight: bold; }

    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <h1>LINE会計（カード請求）</h1>
  <p class="sub-lead">LINEで登録された診察券・クレジットカードに、診療費を請求します。請求の前に、必ず診察券と本人を確認してください。</p>

  <!-- 合言葉 -->
  <div class="panel" id="loginPanel">
    <h2>スタッフ用の合言葉</h2>
    <div class="row">
      <input type="password" id="pinInput" autocomplete="off" placeholder="合言葉">
      <button class="btn" id="pinBtn">開く</button>
    </div>
    <div class="msg" id="pinMsg"></div>
  </div>

  <div id="mainArea" hidden style="display:contents">
    <!-- 請求 -->
    <div class="panel">
      <h2>請求する</h2>
      <div class="row">
        <label class="field">診察券番号
          <input type="text" id="cardNumberInput" inputmode="numeric" maxlength="12" autocomplete="off" placeholder="例：12345">
        </label>
        <button class="btn" id="lookupBtn" style="align-self:flex-end">検索</button>
      </div>
      <div class="msg" id="lookupMsg"></div>

      <div id="chargeArea" hidden>
        <div class="target" id="targetBox"></div>
        <div class="row" style="margin-top:12px">
          <label class="field">請求金額（円）
            <input type="number" id="amountInput" inputmode="numeric" min="1" max="200000" placeholder="例：3500">
          </label>
          <button class="btn green" id="chargeBtn" style="align-self:flex-end">請求する</button>
        </div>
        <div class="msg" id="chargeMsg"></div>
      </div>
    </div>

    <!-- 確認待ち -->
    <div class="panel">
      <div class="row" style="justify-content:space-between">
        <h2>確認待ちのカード登録</h2>
        <button class="btn ghost small" id="refreshPendingBtn">更新</button>
      </div>
      <p class="hint">患者さんが自分で登録した内容です。診察券と本人（保険証など）で名前・生年月日を確かめてから「確認済みにする」を押してください。確認済みの診察券番号にだけ請求できます。</p>
      <div id="pendingList"><span class="empty">読み込み中...</span></div>
    </div>

    <!-- 履歴 -->
    <div class="panel">
      <div class="row" style="justify-content:space-between">
        <h2>直近の請求</h2>
        <button class="btn ghost small" id="refreshLogBtn">更新</button>
      </div>
      <div id="logList"><span class="empty">読み込み中...</span></div>
    </div>
  </div>

  <script>
    const el = id => document.getElementById(id);
    let pin = '';
    try { pin = sessionStorage.getItem('staffPin') || ''; } catch (e) {}

    async function api(body) {
      const res = await fetch('/api/staff-pay', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-staff-pin': pin },
        body: JSON.stringify(body)
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw Object.assign(new Error(data.error || 'error'), { status: res.status });
      return data;
    }

    function setMsg(id, text, kind) {
      const m = el(id);
      m.textContent = text;
      m.className = 'msg' + (kind ? ' ' + kind : '');
    }

    function newKey() {
      return (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2));
    }

    // ── 合言葉 ──
    async function tryLogin() {
      try {
        await api({ action: 'ping' });
        try { sessionStorage.setItem('staffPin', pin); } catch (e) {}
        el('loginPanel').hidden = true;
        el('mainArea').hidden = false;
        el('mainArea').style.display = 'contents';
        loadPending();
        loadLog();
        return true;
      } catch (err) {
        pin = '';
        try { sessionStorage.removeItem('staffPin'); } catch (e) {}
        el('loginPanel').hidden = false;
        el('mainArea').hidden = true;
        if (err.status === 429) setMsg('pinMsg', '失敗が続いたため、しばらく使えません。時間をおいてください', 'err');
        else if (err.status === 503) setMsg('pinMsg', 'まだ設定が済んでいません（STAFF_PIN）', 'err');
        else if (err.status === 401) setMsg('pinMsg', '合言葉が違います', 'err');
        return false;
      }
    }

    el('pinBtn').addEventListener('click', () => {
      pin = el('pinInput').value;
      el('pinInput').value = '';
      setMsg('pinMsg', '', '');
      tryLogin();
    });
    el('pinInput').addEventListener('keydown', e => { if (e.key === 'Enter') el('pinBtn').click(); });

    // ── 請求 ──
    let target = null;     // 検索で見つかった請求先
    let idempotencyKey = newKey();

    function resetCharge() {
      target = null;
      el('chargeArea').hidden = true;
      setMsg('chargeMsg', '', '');
    }

    el('cardNumberInput').addEventListener('input', () => { resetCharge(); setMsg('lookupMsg', '', ''); });
    el('amountInput').addEventListener('input', () => { idempotencyKey = newKey(); setMsg('chargeMsg', '', ''); });
    el('cardNumberInput').addEventListener('keydown', e => { if (e.key === 'Enter') el('lookupBtn').click(); });

    el('lookupBtn').addEventListener('click', async () => {
      const cardNumber = el('cardNumberInput').value.trim();
      if (!cardNumber) return;
      resetCharge();
      el('lookupBtn').disabled = true;
      setMsg('lookupMsg', '検索中...', '');
      try {
        const data = await api({ action: 'lookup', cardNumber });
        if (!data.found) {
          setMsg('lookupMsg', 'この診察券番号で、確認済みのカードはありません（下の「確認待ち」をご確認ください）', 'warn');
          return;
        }
        target = { cardNumber, name: data.name };
        el('targetBox').innerHTML = '';
        const b = document.createElement('b');
        b.textContent = data.name + ' 様';
        el('targetBox').append(b, document.createElement('br'),
          '診察券 ' + cardNumber + '　／　' + data.brand.toUpperCase() + ' •••• ' + data.last4);
        el('chargeArea').hidden = false;
        idempotencyKey = newKey();
        setMsg('lookupMsg', '', '');
        el('amountInput').focus();
      } catch (err) {
        if (err.status === 401) { tryLogin(); return; }
        setMsg('lookupMsg', '検索に失敗しました。通信環境を確認してください', 'err');
      } finally {
        el('lookupBtn').disabled = false;
      }
    });

    el('chargeBtn').addEventListener('click', async () => {
      if (!target) return;
      const amount = Number(el('amountInput').value);
      if (!Number.isInteger(amount) || amount < 1 || amount > 200000) {
        setMsg('chargeMsg', '金額は1〜200,000円の整数で入力してください', 'warn');
        return;
      }
      if (!confirm(target.name + ' 様に ' + amount.toLocaleString('ja-JP') + ' 円を請求します。\n診察券と本人を確認済みですか？')) return;

      el('chargeBtn').disabled = true;
      setMsg('chargeMsg', '請求中...', '');
      try {
        const data = await api({ action: 'charge', cardNumber: target.cardNumber, amount, idempotencyKey });
        if (data.ok) {
          setMsg('chargeMsg', amount.toLocaleString('ja-JP') + ' 円を請求しました（決済完了）', 'ok');
          el('amountInput').value = '';
          idempotencyKey = newKey();
          loadLog();
        } else if (data.reason === 'authentication_required') {
          setMsg('chargeMsg', 'カード会社の認証が必要なため請求できませんでした。窓口でのお支払いに切り替えてください', 'err');
          loadLog();
        } else if (data.reason === 'not_verified') {
          setMsg('chargeMsg', '確認済みのカードがありません', 'err');
        } else {
          setMsg('chargeMsg', '請求できませんでした（' + data.reason + '）。窓口でのお支払いに切り替えてください', 'err');
          loadLog();
        }
      } catch (err) {
        if (err.status === 401) { tryLogin(); return; }
        setMsg('chargeMsg', '通信に失敗しました。請求されたか不明です。「直近の請求」を確認してから、やり直してください', 'err');
        loadLog();
      } finally {
        el('chargeBtn').disabled = false;
      }
    });

    // ── 確認待ち ──
    async function loadPending() {
      const box = el('pendingList');
      try {
        const data = await api({ action: 'pending' });
        box.innerHTML = '';
        if (data.items.length === 0) {
          box.innerHTML = '<span class="empty">確認待ちはありません</span>';
          return;
        }
        box.style.display = 'flex';
        box.style.flexDirection = 'column';
        box.style.gap = '10px';
        data.items.forEach(item => {
          const wrap = document.createElement('div');
          wrap.className = 'pending';
          const head = document.createElement('div');
          head.className = 'head';
          head.textContent = item.brand.toUpperCase() + ' •••• ' + item.last4 + '（' +
            new Date(item.registeredAt).toLocaleString('ja-JP') + ' 登録）';
          wrap.appendChild(head);

          if (item.cards.length === 0) {
            const none = document.createElement('div');
            none.className = 'hint';
            none.textContent = '診察券が登録されていません';
            wrap.appendChild(none);
          }
          item.cards.forEach(c => {
            const row = document.createElement('div');
            row.className = 'card-row';
            const text = document.createElement('span');
            text.textContent = '診察券 ' + c.cardNumber + '　' + c.name + ' 様　' + c.birth.replace(/-/g, '/') + '生' +
              (c.taken ? '　⚠この番号は別のカードで確認済み' : '');
            const btn = document.createElement('button');
            btn.className = 'btn small';
            btn.textContent = '確認済みにする';
            btn.addEventListener('click', async () => {
              const warn = c.taken ? '\n※この番号で確認済みの別のカードは、取り消されます。' : '';
              if (!confirm('診察券 ' + c.cardNumber + '（' + c.name + ' 様）を、診察券と本人で確認しましたか？' + warn)) return;
              btn.disabled = true;
              try {
                await api({ action: 'verify', ref: item.ref, cardNumber: c.cardNumber });
                loadPending();
              } catch (err) {
                btn.disabled = false;
                alert('確認済みにできませんでした');
              }
            });
            row.append(text, btn);
            wrap.appendChild(row);
          });
          box.appendChild(wrap);
        });
      } catch (err) {
        if (err.status === 401) { tryLogin(); return; }
        box.innerHTML = '<span class="empty">読み込めませんでした</span>';
      }
    }
    el('refreshPendingBtn').addEventListener('click', loadPending);

    // ── 履歴 ──
    async function loadLog() {
      const box = el('logList');
      try {
        const data = await api({ action: 'recent' });
        box.innerHTML = '';
        if (data.items.length === 0) {
          box.innerHTML = '<span class="empty">まだ請求はありません</span>';
          return;
        }
        data.items.forEach(it => {
          const row = document.createElement('div');
          row.className = 'log-row';
          const when = document.createElement('span');
          when.textContent = new Date(it.at).toLocaleString('ja-JP');
          const num = document.createElement('span');
          num.textContent = '診察券 ' + it.cardNumber;
          const amt = document.createElement('span');
          amt.textContent = it.amount.toLocaleString('ja-JP') + ' 円';
          const st = document.createElement('span');
          st.className = it.ok ? 'good' : 'ng';
          st.textContent = it.ok ? '決済完了' : '失敗（' + it.reason + '）';
          row.append(when, num, amt, st);
          box.appendChild(row);
        });
      } catch (err) {
        if (err.status === 401) { tryLogin(); return; }
        box.innerHTML = '<span class="empty">読み込めませんでした</span>';
      }
    }
    el('refreshLogBtn').addEventListener('click', loadLog);

    if (pin) tryLogin();
  </script>
</body>
</html>
