<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>診察券 読取リスト</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Meiryo", sans-serif; background: #f2f5f7; color: #263238; }
  header { background: #00796b; color: #fff; padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; flex: 1; }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 8px; padding: 8px 14px; }
  .btn-main { background: #fff; color: #00796b; font-weight: bold; }
  .btn-danger { background: #c62828; color: #fff; }
  main { max-width: 900px; margin: 0 auto; padding: 12px; }
  #reader { width: 100%; max-width: 360px; margin: 0 auto 8px; display: none; }
  .scanbox { display: flex; gap: 8px; margin-bottom: 8px; }
  .scanbox input { flex: 1; font-size: 18px; padding: 10px; border: 2px solid #b0bec5; border-radius: 8px; }
  .scanbox input:focus { border-color: #00796b; outline: 0; }
  .scanbox button { background: #00796b; color: #fff; }
  .bar { display: flex; justify-content: space-between; align-items: center; margin: 12px 0 6px; font-size: 14px; color: #546e7a; }
  ol { list-style: none; margin: 0; padding: 0; }
  li { display: flex; flex-wrap: wrap; row-gap: 6px; align-items: center; gap: 8px; background: #fff; border-radius: 10px; padding: 8px 10px; margin-bottom: 6px; min-height: 58px; border: 1px solid #e0e6ea; }
  li.empty { background: transparent; border: 1px dashed #cfd8dc; }
  li.new { animation: flash 1.2s; }
  @keyframes flash { from { background: #fff59d; } to { background: #fff; } }
  .gone { flex: 1; color: #b0bec5; text-decoration: line-through; font-size: 18px; }
  .restore { background: #fff8e1; color: #f57f17; font-weight: bold; white-space: nowrap; }
  .no { width: 26px; color: #90a4ae; font-size: 14px; text-align: right; flex: none; }
  .num { flex: 1 0 auto; min-width: 100px; font-size: 26px; font-weight: bold; letter-spacing: 1px; font-variant-numeric: tabular-nums; word-break: break-all; }
  .dup { font-size: 11px; background: #ffe0b2; color: #e65100; border-radius: 4px; padding: 1px 5px; margin-left: 6px; font-weight: normal; letter-spacing: 0; }
  .copy { background: #e0f2f1; color: #00695c; font-weight: bold; }
  .copy.done { background: #00796b; color: #fff; }
  .del { background: #ffebee; color: #c62828; font-weight: bold; }
  .info { flex: none; text-align: right; font-size: 15px; line-height: 1.3; min-width: 110px; }
  .info .t { font-weight: bold; color: #00796b; }
  .info .n { color: #37474f; }
  .out { background: #ff8f00; color: #fff; font-weight: bold; border-radius: 6px; padding: 4px 10px; font-size: 15px; }
  li.gai { background: #fff3e0; border-color: #ffcc80; }
  .pdfbar { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 13px; color: #546e7a; flex-wrap: wrap; }
  .pdfbar label { background: #fff; border: 1px solid #00796b; color: #00796b; border-radius: 8px; padding: 6px 12px; cursor: pointer; font-weight: bold; }
  .pdfbar .warn { color: #c62828; font-weight: bold; }
  .marks { display: grid; grid-template-columns: repeat(4, 28px); gap: 3px; flex: none; }
  .mk { width: 28px; height: 34px; padding: 0; font-size: 14px; font-weight: bold; border-radius: 6px; border: 2px solid transparent; }
  .mk0 { --c: #1e88e5; --l: #e3f2fd; } .mk1 { --c: #43a047; --l: #e8f5e9; }
  .mk2 { --c: #fb8c00; --l: #fff3e0; } .mk3 { --c: #8e24aa; --l: #f3e5f5; }
  .mk { background: var(--l); color: var(--c); opacity: .55; border-color: var(--l); }
  .mk.on { background: var(--c); color: #fff; opacity: 1; border-color: var(--c); }
  .tm { flex: none; width: 42px; font-size: 13px; color: #546e7a; font-variant-numeric: tabular-nums; }
  .memo { flex: 1 0 100%; order: 10; margin-left: 34px; max-width: calc(100% - 34px); font: inherit; font-size: 16px; padding: 10px; border: 1px solid #cfd8dc; border-radius: 8px; }
  .memo:focus { border-color: #00796b; outline: 0; }
  li.inf { background: #ffcdd2; border: 2px solid #e53935; }
  .infbadge { display: inline-block; background: #d32f2f; color: #fff; font-weight: bold; border-radius: 6px; padding: 3px 10px; font-size: 15px; margin-top: 2px; }
  .histbtn { background: #fff; border: 1px solid #90a4ae; color: #455a64; padding: 6px 12px; font-size: 13px; }
  #hist { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 10; }
  #hist .box { background: #fff; max-width: 560px; margin: 5vh auto; max-height: 85vh; overflow: auto; border-radius: 12px; padding: 14px; }
  #hist h2 { font-size: 16px; margin: 0 0 4px; }
  #hist p { font-size: 12px; color: #607d8b; margin: 0 0 8px; }
  #hist .hrow { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-top: 1px solid #eceff1; font-size: 14px; }
  #hist .hrow .ht { width: 72px; color: #546e7a; font-variant-numeric: tabular-nums; }
  #hist .hrow .ho { flex: 1; } #hist .hrow .ho.reset { color: #c62828; font-weight: bold; }
  #hist .hrow button { background: #e0f2f1; color: #00695c; padding: 5px 10px; font-weight: bold; }
  .grip { flex: none; width: 26px; height: 34px; line-height: 34px; text-align: center; color: #90a4ae; font-size: 20px; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
  #list { position: relative; }
  li { transition: transform .15s ease; }
  li.dragging { position: relative; z-index: 5; transition: none; border: 2px solid #00796b; box-shadow: 0 8px 22px rgba(0,0,0,.3); opacity: .96; }
  .ph { position: absolute; left: 0; right: 0; border: 3px dashed #00897b; background: rgba(0,150,136,.12); border-radius: 10px; pointer-events: none; z-index: 1; transition: top .15s ease; }
  .drophint { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 20; background: #004d40; color: #fff; border-radius: 12px; padding: 10px 16px; font-size: 15px; line-height: 1.5; box-shadow: 0 4px 16px rgba(0,0,0,.35); max-width: 92vw; pointer-events: none; }
  .drophint .hm { font-weight: bold; font-size: 16px; color: #ffe082; }
  .tm.hot { color: #d32f2f; font-weight: bold; }
  .firstbadge { display: inline-block; background: #1565c0; color: #fff; font-weight: bold; border-radius: 6px; padding: 3px 10px; font-size: 15px; margin: 2px 0 0 4px; }
  .st { display: flex; gap: 3px; flex: none; }
  .st .mk { width: auto; padding: 0 8px; font-size: 13px; }
  .mk6 { --c: #3949ab; --l: #e8eaf6; }
  .mk5:not(.on) { background: #fffafc; color: #edb7ca; border-color: #fdeef3; opacity: 1; }
  .mk4 { --c: #546e7a; --l: #eceff1; } .mk5 { --c: #d81b60; --l: #fce4ec; }
  .copy, .del { white-space: nowrap; }
  @media (max-width: 880px) {
    li { flex-wrap: wrap; row-gap: 4px; }
    .num { font-size: 22px; min-width: 110px; }
    .copy, .del { padding: 8px 9px; }
    .st { order: 11; padding-left: 34px; }
    .info { order: 9; flex-basis: 100%; text-align: left; padding-left: 34px; display: flex; gap: 10px; align-items: baseline; }
    .info:empty { display: none; }
  }
  #msg { min-height: 20px; font-size: 13px; color: #00796b; }
</style>
</head>
<body>
<header>
  <h1>診察券 読取リスト</h1>
  <button class="btn-main" id="camBtn">カメラで読取</button>
  <button class="btn-danger" id="clearBtn">リセット</button>
</header>
<main>
  <div class="pdfbar">
    <label>本日の予約PDFを読込<input type="file" id="pdfIn" accept="application/pdf" hidden></label>
    <span id="pdfInfo">予約PDF未読込</span>
    <button id="histBtn" class="histbtn">履歴</button>
    <span id="sync" style="margin-left:auto">接続中…</span>
  </div>
  <div id="reader"></div>
  <div class="scanbox">
    <input id="inp" inputmode="numeric" autocomplete="off" placeholder="バーコードリーダー / 手入力 → Enter">
    <button id="addBtn">追加</button>
  </div>
  <div id="msg"></div>
  <div class="bar"><span id="count"></span><span>番号をタップでコピー</span></div>
  <ol id="list"></ol>
</main>
<div id="hist"><div class="box">
  <h2>操作の履歴（直近の操作ぶん）</h2>
  <p>「復元」を押すと、その操作が終わった時点の読取リスト・印・メモに戻ります（予約PDFはそのまま）。消えた直前の行を選んでください。</p>
  <div id="histList">読み込み中…</div>
  <div style="text-align:right;margin-top:8px"><button class="histbtn" id="histClose">閉じる</button></div>
</div></div>

    var out = {}, cols = null;

        .map(function (i) { return { s: i.str.trim(), x: i.transform[4], y: i.transform[5] }; });
      // ヘッダー位置から列境界を決定
      // 見出しは1ページ目にしか無いので、最初に見つけた列位置を以降のページでも使う
      var hName = items.find(function (i) { return i.s === 'なまえ'; });
      var hNo = items.find(function (i) { return i.s.indexOf('カルテNo') === 0; });
      var hMenu = items.find(function (i) { return i.s === '診療メニュー'; });
      var hMa = items.find(function (i) { return i.s === 'マ'; });
      var hState = items.find(function (i) { return i.s === '状態'; });
      if (hName && hNo && hMenu) {
        cols = { xName: hName.x - 8, xNo: hNo.x - 4, xMenu: hMenu.x - 4, xMa: hMa ? hMa.x - 6 : null, xSt: hState ? hState.x - 4 : null };
      }
      if (!cols) continue;
      var xName = cols.xName, xNo = cols.xNo, xMenu = cols.xMenu;
      var times = items.filter(function (i) { return i.x < xName && /^\d{1,2}:\d{2}$/.test(i.s) && (!hName || i.y < hName.y - 5); });
      var ts = times.slice().sort(function (a, b) { return b.y - a.y; });
      times.forEach(function (t) {
        var row = items.filter(function (i) { return Math.abs(i.y - t.y) < 4; });
        var name = row.filter(function (i) { return i.x >= xName && i.x < xNo; })
          .sort(function (a, b) { return a.x - b.x; }).map(function (i) { return i.s; }).join(' ').replace(/[\s　]+/g, ' ');
        // 名前が「姓　名」で分かれて出る場合の空白を整える
        var no = row.filter(function (i) { return i.x >= xNo && i.x < xMenu && /^\d+$/.test(i.s); })[0];
        if (!no) return;
        var key = norm(no.s);
        // 「マ」列に「感染」と書かれている患者（文字が折り返しても拾えるよう行の範囲を連結）
        var nx = ts[ts.indexOf(t) + 1], lo = nx ? nx.y + 4 : t.y - 60;
        function cellText(x0, x1) {

            .sort(function (a, b) { return b.y - a.y || a.x - b.x; }).map(function (i) { return i.s; }).join('');
        }
        var why = [];
        if (cols.xMa !== null && cols.xSt !== null && cellText(cols.xMa, cols.xSt).indexOf('感染') >= 0) why.push('感染');
        var menu = cellText(cols.xMenu, cols.xMa !== null ? cols.xMa : xMenu + 140);
        if (/EKC/i.test(menu)) why.push('EKC');
        // メニューは長いと「再診（下記以外）,初...」のように省略表示されるので「,初」も初診扱い
        var first = /初診|,初/.test(menu);

        if (why.length) { out[key].inf = true; out[key].infWhy = why.join('・'); }

        info.appendChild(ib);
      }
      if (hit && hit.first) {
        var fb = document.createElement('span'); fb.className = 'firstbadge'; fb.textContent = '初診';
        info.appendChild(fb);
      }
      var memo = document.createElement('input'); memo.className = 'memo'; memo.placeholder = 'メモ'; memo.maxLength = 200;
      memo.setAttribute('data-i', i); memo.value = memos[i] || '';
      memo.onchange = function () { if (memo.value !== (memos[i] || '')) send({ op: 'memo', index: i, text: memo.value }); };
      memo.onkeydown = function (e) { if (e.key === 'Enter') { memo.blur(); $('inp').focus(); } };
      var st = document.createElement('span'); st.className = 'st';
      [['1診', 6], ['変わりない', 4], ['よくなった', 5]].forEach(function (d) {
        var b = document.createElement('button'); b.className = 'mk mk' + d[1] + ((marks[i] | 0) & (1 << d[1]) ? ' on' : ''); b.textContent = d[0];
        b.onclick = function () { var on = !b.classList.contains('on'); b.classList.toggle('on', on); send({ op: 'mark', index: i, flag: d[1], on: on }); };
        st.appendChild(b);
      });
      var cb = document.createElement('button'); cb.className = 'copy'; cb.textContent = 'コピー';
      cb.onclick = function () { copy(v, cb); };
      var db = document.createElement('button'); db.className = 'del'; db.textContent = '削除';
      db.onclick = function () { send({ op: 'del', index: i }); };
      li.appendChild(mk); li.appendChild(num); li.appendChild(info); li.appendChild(memo); li.appendChild(st); li.appendChild(cb); li.appendChild(db);
      ol.appendChild(li);
    });
    $('count').textContent = live + ' 件';
    newIdx = -1;
    if (keep) {
      var again = ol.querySelector('.memo[data-i="' + keep.i + '"]');
      if (again) { again.value = keep.v; again.focus(); try { again.setSelectionRange(keep.pos, keep.pos); } catch (e) {} }
    }
  }


  // ---- 端末間の同期（サーバー側で暗号化して保存）----
  var marks = [], trash = [], times = [], memos = [];
  var MARK_LABELS = ['薬', '保', '糖', '他'];
  var rev = -1, busy = 0, pendingNew = false, resetByMe = false;
  function setSync(ok, text) { var el = $('sync'); el.textContent = text; el.style.color = ok ? '#2e7d32' : '#c62828'; }
  function api(method, body, query) {
    return fetch('/api/scan-sync' + (query || (method === 'GET' ? '?rev=' + rev : '')), {
      method: method,
      headers: { 'Content-Type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined
    }).then(function (r) {
      if (!r.ok) throw new Error('通信エラー ' + r.status);
      return r.json();
    });
  }
  function applyState(st) {
    setSync(true, '同期中');
    if (st.unchanged) return;
    var before = items.filter(function (v) { return v !== null; }).length;
    var after = (st.items || []).filter(function (v) { return v !== null; }).length;
    if (before > 0 && after === 0 && !resetByMe) $('msg').textContent = '⚠ 共有データが空になりました。「履歴」から直前の状態に復元できます';
    resetByMe = false;
    rev = st.rev; items = st.items; marks = st.marks || []; trash = st.trash || []; times = st.times || []; memos = st.memos || []; appt = st.appt || {}; apptLoaded = !!st.appt;
    if (pendingNew) { newIdx = items.length - 1; }
    showPdfInfo(); render();
    if (pendingNew) { var last = $('list').lastElementChild; if (last) last.scrollIntoView({ block: 'nearest' }); pendingNew = false; }
  }
  var OP_LABEL = { add: '番号追加', del: '削除', restore: '復活', mark: '印の変更', memo: 'メモ', reset: 'リセット', appt: '予約PDF読込', rollback: '履歴から復元', move: '並べ替え' };
  function hm(t) { return new Date(t).toLocaleTimeString('ja-JP', { timeZone: 'Asia/Tokyo', hour12: false }); }
  $('histBtn').onclick = function () {
    $('hist').style.display = 'block'; var box = $('histList'); box.textContent = '読み込み中…';
    api('GET', null, '?history=1').then(function (list) {
      box.innerHTML = '';
      if (!list.length) { box.textContent = '履歴はまだありません'; return; }
      list.forEach(function (e) {
        var r = document.createElement('div'); r.className = 'hrow';
        r.innerHTML = '<span class="ht"></span><span class="ho"></span><span class="hn"></span>';
        r.children[0].textContent = hm(e.t);
        r.children[1].textContent = OP_LABEL[e.op] || e.op; if (e.op === 'reset') r.children[1].classList.add('reset');
        r.children[2].textContent = e.n + '件';
        var b = document.createElement('button'); b.textContent = '復元';
        b.onclick = function () {
          if (!confirm(hm(e.t) + ' の時点（' + e.n + '件）に戻します。現在の内容は置き換わります（この操作も履歴に残ります）。よろしいですか？')) return;
          $('hist').style.display = 'none'; send({ op: 'rollback', rev: e.rev }).then(function () { $('msg').textContent = '履歴から復元しました'; });
        };
        r.appendChild(b); box.appendChild(r);
      });
    }).catch(function (e) { box.textContent = '履歴を読み込めません: ' + e.message; });
  };
  $('histClose').onclick = function () { $('hist').style.display = 'none'; };

  function fail(e) { pendingNew = false; render(); setSync(false, '未同期'); $('msg').textContent = '同期できません: ' + e.message; }
  function send(body) {
    busy++;
    return api('POST', body).then(applyState).catch(fail).then(function () { busy--; });
  }
  function poll() {
    if (busy || dragging || document.hidden) return;
    api('GET').then(applyState).catch(function (e) { setSync(false, '未同期'); $('msg').textContent = '同期できません: ' + e.message; });
  }
  setInterval(poll, 5000);
  document.addEventListener('visibilitychange', poll);

  function copy(text, btn) {
    function ok() {
      document.querySelectorAll('.copy.done').forEach(function (b) { b.classList.remove('done'); b.textContent = 'コピー'; });
      btn.classList.add('done'); btn.textContent = 'コピー済';
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(ok, function () { fallback(text); ok(); });
    } else { fallback(text); ok(); }
  }
  function fallback(text) {
    var t = document.createElement('textarea'); t.value = text; document.body.appendChild(t);
    t.select(); try { document.execCommand('copy'); } catch (e) {} document.body.removeChild(t);
  }

  function add(raw, fromCamera) {
    var code = String(raw || '').trim();
    if (!code) return;
    var now = Date.now();
    // カメラは同じコードを連続検出するので3秒間は無視
    if (fromCamera && code === lastCode && now - lastAt < 3000) { lastAt = now; return; }
    lastCode = code; lastAt = now;
    pendingNew = true;         // サーバー側で常に最下行へ追加（空きスペースは再利用しない）
    send({ op: 'add', code: code }).then(function () { $('msg').textContent = '読取: ' + code; });
  }

  $('inp').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { add(this.value, false); this.value = ''; }
  });
  $('addBtn').onclick = function () { add($('inp').value, false); $('inp').value = ''; $('inp').focus(); };

  $('clearBtn').onclick = function () {
    if (!items.length) return;
    if (confirm('読取リストを空にして、番号の順番もリセットします。\n（読み込んだ予約PDFはそのまま残ります）\nよろしいですか？')) { lastCode = ''; resetByMe = true; send({ op: 'reset' }); $('inp').focus(); }
  };

  var scanner = null;
  $('camBtn').onclick = function () {
    var r = $('reader');
    if (scanner) {
      scanner.stop().then(function () { scanner.clear(); scanner = null; r.style.display = 'none'; $('camBtn').textContent = 'カメラで読取'; });
      return;
    }
    r.style.display = 'block';
    scanner = new Html5Qrcode('reader');
    scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 260, height: 160 } },
      function (text) { add(text, true); }, function () {})
      .then(function () { $('camBtn').textContent = 'カメラ停止'; })
      .catch(function (err) { $('msg').textContent = 'カメラを起動できません: ' + err; scanner = null; r.style.display = 'none'; });
  };

  showPdfInfo();
  render();
  poll();
  $('inp').focus();
  // バーコードリーダーはキー入力として届くので、他をクリックしても入力欄へ戻す
  document.addEventListener('click', function (e) {
    if (e.target.tagName !== 'BUTTON' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'LABEL') $('inp').focus();
  });
})();
</script>
</body>
</html>
